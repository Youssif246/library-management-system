<div class="members-container">
  <!-- Members Header -->
  <header class="members-header">
    <div class="header-left">
      <h1 class="header-title">Members</h1>
      <p class="header-subtitle">Manage library registrations and check-out logs.</p>
    </div>

    <div class="header-right">
      <button class="btn-primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        <span>Add Member</span>
      </button>
    </div>
  </header>

  <!-- Controls Section (Search) -->
  <section class="controls-section">
    <!-- Search Bar -->
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" placeholder="Search members..." class="search-input" />
    </div>
  </section>

  <!-- Members List Section -->
  <section class="list-section">
    <div class="table-container">
      <table class="members-table">
        <thead>
          <tr>
            <th>Member</th>
            <th>Phone</th>
            <th>Joined</th>
            <th>Borrowed</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="member-info-cell">
              <div class="member-avatar blue-gradient">AA</div>
              <div class="member-meta">
                <span class="member-name">Ahmed Ali</span>
                <span class="member-email">ahmed.ali@example.com</span>
              </div>
            </td>
            <td class="phone-cell">010-9876-5432</td>
            <td class="date-cell">Jul 12, 2026</td>
            <td class="borrowed-cell">
              <span class="borrow-count highlight">2 books</span>
            </td>
            <td class="text-right">
              <div class="actions-group">
                <button class="btn-action">Edit</button>
                <button class="btn-icon-only">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="1" />
                    <circle cx="12" cy="5" r="1" />
                    <circle cx="12" cy="19" r="1" />
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
