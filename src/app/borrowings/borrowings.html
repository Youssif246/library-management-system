<div class="borrowings-container">
  <!-- Borrowings Header -->
  <header class="borrowings-header">
    <div class="header-left">
      <h1 class="header-title">Borrowings</h1>
      <p class="header-subtitle">Track book issues, returns, and overdue assets.</p>
    </div>

    <div class="header-right">
      <button class="btn-primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        <span>New Borrowing</span>
      </button>
    </div>
  </header>

  <!-- Filter Tabs Bar Section -->
  <section class="controls-section">
    <div class="filter-tabs">
      <button class="tab-btn active">Active</button>
      <button class="tab-btn">Returned</button>
      <button class="tab-btn">Overdue</button>
    </div>
  </section>

  <!-- Borrowings List Section -->
  <section class="list-section">
    <div class="table-container">
      <table class="borrowings-table">
        <thead>
          <tr>
            <th>Book</th>
            <th>Member</th>
            <th>Borrowed</th>
            <th>Due</th>
            <th>Status</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="book-info-cell">
              <div class="book-cover-art blue-gradient">
                <svg class="cover-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z" />
                </svg>
              </div>
              <div class="book-meta">
                <span class="book-title-text">Clean Code</span>
                <span class="book-author">R. Martin</span>
              </div>
            </td>
            <td>
              <div class="member-badge">
                <div class="member-avatar blue-gradient">AA</div>
                <div class="member-meta">
                  <span class="member-name">Ahmed Ali</span>
                  <span class="member-id">ID: #MEM-204</span>
                </div>
              </div>
            </td>
            <td class="date-cell">Jul 25, 2026</td>
            <td class="date-cell">Aug 08, 2026</td>
            <td>
              <span class="badge badge-info">Active</span>
            </td>
            <td class="text-right">
              <div class="actions-group">
                <button class="btn-action">Return</button>
                <button class="btn-icon-only">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="1" />
                    <circle cx="12" cy="5" r="1" />
                    <circle cx="12" cy="19" r="1" />
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
